apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.madtools.api.deployment }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.madtools.api.app }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.madtools.api.app }}
      task: {{ .Values.madtools.api.name }}
  template:
    metadata:
      labels:
        app: {{ .Values.madtools.api.app }}
        task: {{ .Values.madtools.api.name }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: {{ .Values.madtools.api.name }}
          image: {{ .Values.madtools.api.image }}:{{ .Values.madtools.api.tag }}
          startupProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.madtools.api.port }}
            periodSeconds: 5
            failureThreshold: 100
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.madtools.api.port }}
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.madtools.api.port }}
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 200Mi
              ephemeral-storage: "1Gi"
            limits:
              cpu: 100m
              memory: 200Mi
              ephemeral-storage: "1Gi"
          env:
            - name: OpenTelemetrySettings__Mode
              value: FullStack
            - name: OpenTelemetrySettings__Seq__Url
              value: http://{{ .Values.logger.loadBalancer }}
            - name: OpenTelemetrySettings__Seq__ApiKey
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.logger.secret.name }}
                  key: apikeytools
          ports:
            - containerPort: {{ .Values.madtools.api.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.madtools.api.loadBalancer }}
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: {{ .Values.madtools.api.app }}
    task: {{ .Values.madtools.api.name }}
  ports:
    - protocol: TCP
      name: http
      port: {{ .Values.madtools.api.port }}
      targetPort: {{ .Values.madtools.api.port }}
  type: LoadBalancer